name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: build single file
        shell: pwsh
        run: ./build.ps1

      - name: unit + integration
        shell: pwsh
        run: ./tests/run_tests.ps1

      - name: e2e
        shell: pwsh
        run: ./tests/e2e_local.ps1

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: pwsh
        run: ./build.ps1

      - name: verify single file runs standalone
        shell: pwsh
        run: ./dist/placebo.ps1 version

      - uses: actions/upload-artifact@v4
        with:
          name: placebo
          path: dist/placebo.ps1
